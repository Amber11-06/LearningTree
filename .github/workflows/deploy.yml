name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learningtree-production
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learningtree_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEARNINGTREE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/learningtree_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Frontend tests and type check
        run: |
          npm test
          npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Backend tests
        run: python -m pytest -q

  deploy:
    name: Deploy to Sealos Devbox
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Pull, build and restart on Devbox
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEVBOX_HOST }}
          username: ${{ secrets.DEVBOX_USER }}
          key: ${{ secrets.DEVBOX_SSH_KEY }}
          port: ${{ secrets.DEVBOX_PORT }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/devbox/LearningTree
            git fetch origin main
            git reset --hard origin/main
            npm ci --no-audit --no-fund --registry=https://registry.npmmirror.com
            npm run build
            python3 -m venv .venv 2>/dev/null || true
            .venv/bin/pip install -q -i https://pypi.tuna.tsinghua.edu.cn/simple -r backend/requirements.txt
            sudo install -m 644 deploy/supervisord.conf /etc/supervisor/conf.d/learningtree.conf
            sudo supervisorctl reread
            sudo supervisorctl update
            sudo supervisorctl restart learningtree
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
                echo "LearningTree is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            sudo supervisorctl status || true
            sudo tail -n 80 deploy/learningtree.log || true
            exit 1