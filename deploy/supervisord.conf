[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=INT
redirect_stderr=true
stdout_logfile=/var/log/postgresql/learningtree-postgres.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:learningtree]
command=/home/devbox/LearningTree/.venv/bin/uvicorn backend.app.main:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips=*
directory=/home/devbox/LearningTree
user=devbox
autostart=true
autorestart=true
startsecs=5
startretries=10
environment=HOME="/home/devbox",PYTHONUNBUFFERED="1"
redirect_stderr=true
stdout_logfile=/home/devbox/LearningTree/deploy/learningtree.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
